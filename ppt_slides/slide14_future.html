<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FFFFFF; font-family: Arial, 'Microsoft YaHei', sans-serif;
  display: flex;
}
.sidebar { width: 8pt; background: #B165FB; }
.content { flex: 1; padding: 40pt 50pt; }
h1 { font-size: 28pt; color: #181B24; margin-bottom: 20pt; font-weight: bold; }
.two-column {
  display: flex; gap: 25pt; margin-top: 10pt;
}
.column {
  flex: 1;
}
h2 {
  font-size: 18pt; color: #40695B; margin: 0 0 12pt 0; font-weight: bold;
}
ul {
  margin: 0; padding-left: 20pt;
}
li {
  font-size: 13pt; line-height: 1.7; color: #555555; margin-bottom: 8pt;
}
.section-title {
  font-size: 15pt; color: #B165FB; font-weight: bold; margin-bottom: 8pt;
}
</style>
</head>
<body>
<div class="sidebar"></div>
<div class="content">
  <h1>局限性与未来工作</h1>
  
  <div class="two-column">
    <div class="column">
      <h2>局限性 Limitations</h2>
      <ul>
        <li><strong>问题规模：</strong>当前仅在 100 客户规模上测试</li>
        <li><strong>LLM 依赖：</strong>算子质量取决于 LLM 能力</li>
        <li><strong>成本函数固定：</strong>扩展到其他 VRP 变体需重新设计</li>
        <li><strong>缺少对比基线：</strong>未与手工 ALNS 系统对比</li>
      </ul>
    </div>
    
    <div class="column">
      <h2>未来工作 Future Work</h2>
      <ul>
        <li><strong>多 LLM 对比：</strong>GPT-4o、Claude、Gemini 等模型</li>
        <li><strong>自适应提示：</strong>根据执行结果调整提示词</li>
        <li><strong>大规模测试：</strong>Solomon R/RC 类和 G\u0026H 大规模实例</li>
        <li><strong>算子进化：</strong>让 LLM 根据统计数据改进低效算子</li>
      </ul>
    </div>
  </div>
</div>
</body>
</html>
