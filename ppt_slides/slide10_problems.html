<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FFFFFF; font-family: Arial, 'Microsoft YaHei', sans-serif;
  display: flex;
}
.sidebar { width: 8pt; background: #B165FB; }
.content { flex: 1; padding: 40pt 50pt; }
h1 { font-size: 28pt; color: #181B24; margin-bottom: 20pt; font-weight: bold; }
.category-grid {
  display: flex; flex-wrap: wrap; gap: 15pt; margin-top: 15pt;
}
.category-box {
  flex: 1; min-width: 200pt; background: #F8F9FA; padding: 18pt; border-top: 4pt solid #40695B;
}
.category-title {
  font-size: 16pt; color: #181B24; font-weight: bold; margin-bottom: 8pt;
}
.category-count {
  font-size: 32pt; color: #B165FB; font-weight: bold; margin-bottom: 8pt;
}
.category-desc {
  font-size: 12pt; color: #555555; line-height: 1.4;
}
.total-box {
  background: #181B24; color: #FFFFFF; padding: 15pt; margin-bottom: 15pt; text-align: center;
}
.total-number {
  font-size: 48pt; font-weight: bold; color: #B165FB;
}
.total-label {
  font-size: 14pt; margin-top: 5pt;
}
</style>
</head>
<body>
<div class="sidebar"></div>
<div class="content">
  <h1>问题分类总览 Problem Classification</h1>
  
  <div class="total-box">
    <p class="total-number">24</p>
    <p class="total-label">Total Problems Identified \u0026 Solved</p>
  </div>
  
  <div class="category-grid">
    <div class="category-box">
      <p class="category-count">4</p>
      <p class="category-title">A. LLM 代码生成</p>
      <p class="category-desc">LLM 理解偏差 vs 框架严格要求</p>
    </div>
    
    <div class="category-box">
      <p class="category-count">9</p>
      <p class="category-title">B. 算法参数与机制</p>
      <p class="category-desc">算法配置 vs 求解性能</p>
    </div>
    
    <div class="category-box">
      <p class="category-count">8</p>
      <p class="category-title">C. 可视化与交互</p>
      <p class="category-desc">数据展示 vs 学术规范</p>
    </div>
    
    <div class="category-box">
      <p class="category-count">2</p>
      <p class="category-title">D. 工程与维护</p>
      <p class="category-desc">代码可维护性 vs 开发效率</p>
    </div>
    
    <div class="category-box">
      <p class="category-count">1</p>
      <p class="category-title">E. 性能诊断</p>
      <p class="category-desc">局部最优 vs 全局搜索能力</p>
    </div>
  </div>
</div>
</body>
</html>
