<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FFFFFF; font-family: Arial, 'Microsoft YaHei', sans-serif;
  display: flex;
}
.sidebar { width: 8pt; background: #B165FB; }
.content { flex: 1; padding: 40pt 50pt; }
h1 { font-size: 28pt; color: #181B24; margin-bottom: 20pt; font-weight: bold; }
h2 { font-size: 18pt; color: #40695B; margin: 15pt 0 10pt 0; font-weight: bold; }
.table-container {
  margin-top: 15pt;
}
table {
  width: 100%; border-collapse: collapse; font-size: 13pt;
}
th {
  background: #181B24; color: #FFFFFF; padding: 10pt; text-align: left; font-weight: bold;
}
td {
  padding: 8pt; border-bottom: 1pt solid #DDDDDD; color: #333333;
}
.operator-type {
  color: #B165FB; font-weight: bold;
}
</style>
</head>
<body>
<div class="sidebar"></div>
<div class="content">
  <h1>03 算法设计 Algorithm Design</h1>
  
  <h2>ALNS 算子设计 Operator Design</h2>
  <div class="table-container">
    <table>
      <tr>
        <th>类型</th>
        <th>算子名称</th>
        <th>策略描述</th>
      </tr>
      <tr>
        <td class="operator-type">破坏</td>
        <td>random_removal</td>
        <td>随机选择 k 个客户节点移除</td>
      </tr>
      <tr>
        <td class="operator-type">破坏</td>
        <td>route_removal</td>
        <td>随机选择整条路径移除</td>
      </tr>
      <tr>
        <td class="operator-type">破坏</td>
        <td>string_removal</td>
        <td>移除路径中连续的节点段</td>
      </tr>
      <tr>
        <td class="operator-type">修复</td>
        <td>greedy_insert</td>
        <td>插入成本增量最小的位置</td>
      </tr>
      <tr>
        <td class="operator-type">修复</td>
        <td>regret_insert</td>
        <td>优先插入后悔值最大的节点</td>
      </tr>
    </table>
  </div>
</div>
</body>
</html>
