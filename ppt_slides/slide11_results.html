<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FFFFFF; font-family: Arial, 'Microsoft YaHei', sans-serif;
  display: flex;
}
.sidebar { width: 8pt; background: #B165FB; }
.content { flex: 1; padding: 40pt 50pt; }
h1 { font-size: 28pt; color: #181B24; margin-bottom: 20pt; font-weight: bold; }
.result-grid {
  display: flex; gap: 20pt; margin-top: 20pt;
}
.result-box {
  flex: 1; background: #F8F9FA; padding: 20pt; text-align: center;
  border-top: 4pt solid #40695B;
}
.result-value {
  font-size: 42pt; color: #B165FB; font-weight: bold; margin-bottom: 8pt;
}
.result-label {
  font-size: 14pt; color: #181B24; font-weight: bold; margin-bottom: 5pt;
}
.result-sublabel {
  font-size: 11pt; color: #666666;
}
.highlight-result {
  background: #181B24; color: #FFFFFF; padding: 25pt; margin-bottom: 20pt;
  text-align: center; border-radius: 8pt;
}
.highlight-value {
  font-size: 56pt; color: #B165FB; font-weight: bold;
}
.highlight-label {
  font-size: 16pt; margin-top: 8pt;
}
</style>
</head>
<body>
<div class="sidebar"></div>
<div class="content">
  <h1>06 实验结果 Experimental Results</h1>
  
  <div class="highlight-result">
    <p class="highlight-value">42,023.80</p>
    <p class="highlight-label">最优成本 Optimal Cost (元)</p>
  </div>
  
  <div class="result-grid">
    <div class="result-box">
      <p class="result-value">100</p>
      <p class="result-label">客户数量</p>
      <p class="result-sublabel">Solomon C105</p>
    </div>
    
    <div class="result-box">
      <p class="result-value">34</p>
      <p class="result-label">路径数量</p>
      <p class="result-sublabel">Vehicles Used</p>
    </div>
    
    <div class="result-box">
      <p class="result-value">1000</p>
      <p class="result-label">总迭代次数</p>
      <p class="result-sublabel">Total Iterations</p>
    </div>
    
    <div class="result-box">
      <p class="result-value">−1.8%</p>
      <p class="result-label">成本改进</p>
      <p class="result-sublabel">vs V1 (42,775.07)</p>
    </div>
  </div>
</div>
</body>
</html>
