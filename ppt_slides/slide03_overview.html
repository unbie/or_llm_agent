<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FFFFFF; font-family: Arial, 'Microsoft YaHei', sans-serif;
  display: flex;
}
.sidebar { width: 8pt; background: #B165FB; }
.content { flex: 1; padding: 40pt 50pt; }
h1 { font-size: 28pt; color: #181B24; margin-bottom: 25pt; font-weight: bold; }
h2 { font-size: 20pt; color: #40695B; margin: 20pt 0 10pt 0; font-weight: bold; }
p { font-size: 14pt; line-height: 1.6; color: #333333; margin: 0 0 12pt 0; }
ul { margin: 0; padding-left: 30pt; }
li { font-size: 14pt; line-height: 1.8; color: #333333; margin-bottom: 8pt; }
.highlight-box {
  background: #F0F4FF; padding: 15pt; border-left: 4pt solid #B165FB; margin: 15pt 0;
}
</style>

<body>
<div class="sidebar"></div>
<div class="content">
  <h1>01 项目概述 Project Overview</h1>
  
  <h2>研究背景 Background</h2>
  <ul>
    <li>车辆路径问题 (VRP) 是经典的 NP-hard 问题</li>
    <li>生鲜物流场景：新鲜度衰减 + 冷链成本 + 时间窗约束</li>
    <li>传统 ALNS 依赖人工设计算子，开发周期长</li>
  </ul>
  
  <h2>研究目标 Objectives</h2>
  <ul>
    <li>利用 LLM (DeepSeek R1) 自动生成 ALNS 算子代码</li>
    <li>实现"LLM 生成算子 + 框架执行求解"的混合架构</li>
    <li>在 Solomon 基准上验证算法性能</li>
  </ul>
</div>
</body>
</html>
