<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FFFFFF; font-family: Arial, 'Microsoft YaHei', sans-serif;
  display: flex;
}
.sidebar { width: 8pt; background: #B165FB; }
.content { flex: 1; padding: 40pt 50pt; }
h1 { font-size: 28pt; color: #181B24; margin-bottom: 25pt; font-weight: bold; }
.innovation-grid {
  display: flex; flex-wrap: wrap; gap: 15pt; margin-top: 20pt;
}
.innovation-box {
  width: 310pt; background: #F8F9FA; padding: 20pt; border-left: 4pt solid #40695B;
}
.innovation-number {
  font-size: 24pt; color: #B165FB; font-weight: bold; margin-bottom: 8pt;
}
.innovation-title {
  font-size: 16pt; color: #181B24; font-weight: bold; margin-bottom: 8pt;
}
.innovation-desc {
  font-size: 13pt; color: #555555; line-height: 1.5;
}
</style>
</head>
<body>
<div class="sidebar"></div>
<div class="content">
  <h1>核心创新 Core Innovations</h1>
  
  <div class="innovation-grid">
    <div class="innovation-box">
      <p class="innovation-number">01</p>
      <p class="innovation-title">插件式架构 Plugin Architecture</p>
      <p class="innovation-desc">将 ALNS 框架与算子实现解耦，LLM 生成的代码作为"插件"注入框架</p>
    </div>
    
    <div class="innovation-box">
      <p class="innovation-number">02</p>
      <p class="innovation-title">自动调试机制 Auto-Debugging</p>
      <p class="innovation-desc">多轮对话反馈执行错误，LLM 自主修正代码直至成功运行</p>
    </div>
    
    <div class="innovation-box">
      <p class="innovation-number">03</p>
      <p class="innovation-title">完整成本模型 Comprehensive Cost Model</p>
      <p class="innovation-desc">融合固定成本、距离、制冷、货损、时间窗惩罚的五维成本函数</p>
    </div>
    
    <div class="innovation-box">
      <p class="innovation-number">04</p>
      <p class="innovation-title">自适应权重管理 Adaptive Weights</p>
      <p class="innovation-desc">引入权重下限保护机制，防止算子饥饿 (Operator Starvation)</p>
    </div>
  </div>
</div>
</body>
</html>
